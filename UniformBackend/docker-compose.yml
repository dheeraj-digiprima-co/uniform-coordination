version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: uniform-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - uniform-network

  backend:

    image: ghcr.io/dheeraj-digiprima-co/uniform-backend:latest

    container_name: uniform-backend

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8005:8005"

    networks:
      - uniform-network

  adminer:

    image: adminer:latest

    container_name: uniform-adminer

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      ADMINER_DEFAULT_SERVER: mysql

    networks:
      - uniform-network

volumes:

  mysql_data:

networks:

  uniform-network:
